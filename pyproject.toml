[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snapframe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "flask>=3.0",
]

[project.scripts]
snapframe = "snapframe.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snapframe = ["templates/*", "frames/*"]
