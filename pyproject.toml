[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "post-xnapper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
]

[project.scripts]
post-xnapper = "post_xnapper.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
