size = [1500, 1000]
layout = "hero"
padding = 60

[background]
type = "gradient"
colors = ["#1e3c72", "#2a5298"]
angle = 160

[font]
path = "assets/fonts/Inter-Bold.ttf"
size = 64
color = "#ffffff"
align = "center"

[text]
position = "left"

[screenshot]
enabled = true
rounded_corners = 0
shadow = true
shadow_blur = 30
shadow_opacity = 0.6
scale = 0.85

[device_frame]
enabled = true
model = "iphone-16-pro"
finish = "black"

[device_frame.transform]
mode = "float"
float_preset = "right-lean"
